<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kineReqLens</title>
    <!-- Lato, the Kinebot app font (SIL OFL 1.1: fonts/OFL.txt). Declared here, at document level: @font-face rules
         in the shadow root's adopted sheet are ignored, while families declared by the document reach the shadow tree. -->
    <style>
      @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Lato-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Lato'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/Lato-Semibold.ttf') format('truetype'); }
    </style>
    <!-- Transparent and color-scheme "normal" like the iframe element, so the page shows through. -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color-scheme: normal; }
    </style>
  </head>
  <body>
    <div id="reqlens-panel"></div>
    <script src="panel.js"></script>
  </body>
</html>
